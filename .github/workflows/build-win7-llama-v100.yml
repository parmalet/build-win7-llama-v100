name: Build Win7-compatible llama.cpp v1.0.0 (LFM3/Qwen3.8 - P2200)

# 线路C：v1.0.0 引擎（首个稳定版），支持 LFM3 / Qwen3.8 原生 MTP / FP8 KV
# 免费构建机：GitHub Actions windows-2022 runner
# 门禁：import-audit.ps1 检查 Win8+ API 导入，FAIL 则 artifact 带 -AUDIT_FAIL 标签
#
# v1.0.0 相对 v0.8.0 的关键差异（已按 v1.0.0 源码原文核对）：
#   - ggml-cpu.c 的 SetThreadInformation 已自带 #if _WIN32_WINNT >= 0x0602 保护，无需补丁
#   - httplib 升级到 0.66.0，三个 Win8+ API 仍在，补丁锚点行号变 1707/1721/1735
#   - 新增 LLAMA_OPENSSL=ON 默认 -> 显式关闭，减少 Win8+ API 导入风险（离线内网无需 HTTPS）
#   - CMake 最低 3.14...3.28；CUDA 后端 3.18；runner 预装 3.31 满足
#   - CUDA 11.4.3 + sm_61(61-virtual) 官方支持，P2200 可用
#   - LLAMA_USE_PREBUILT_UI 默认 ON 会从 HF 下载 Web UI 资源，b1 校验失败会 FATAL_ERROR；
#     已显式置 OFF + LLAMA_BUILD_UI=OFF，生成空 UI（DSH 只用 HTTP API，不需要 Web 页面）

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        variant: [cpu, cuda]   # cpu = 纯CPU保底；cuda = P2200 sm_61 GPU版
    timeout-minutes: 180   # 降并行度后 CUDA 全量编译更久，放宽上限

    steps:
      # ---------- 0. 检出本仓库（含补丁/门禁脚本） ----------
      - name: Checkout build scripts
        uses: actions/checkout@v4

      # ---------- 1. 装 VS2019 BuildTools + 新版 CMake ----------
      - name: Install VS2019 BuildTools (v142 C++ workload)
        shell: pwsh
        run: |
          choco install visualstudio2019buildtools `
            --package-parameters "--add Microsoft.VisualStudio.Workload.VCTools --includeRecommended --passive --norestart" `
            -y --no-progress --limit-output
          Write-Host "VS2019 BuildTools installed."

      - name: Setup VS2019 x64 developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          vsversion: '2019'
          arch: x64

      - name: Show CMake version
        shell: pwsh
        run: cmake --version   # 需 >= 3.18；runner 预装 3.31 OK

      - name: Ensure Ninja (CUDA job only)
        if: matrix.variant == 'cuda'
        shell: pwsh
        run: |
          if (-not (Get-Command ninja -ErrorAction SilentlyContinue)) {
            choco install ninja -y --no-progress --limit-output
          }
          ninja --version

      # ---------- 2. 装 CUDA 11.4.3（仅 cuda job） ----------
      - name: Install CUDA 11.4.3 (CUDA job only)
        if: matrix.variant == 'cuda'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = "https://developer.download.nvidia.com/compute/cuda/11.4.3/network_installers/cuda_11.4.3_win10_network.exe"
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\cuda1143.exe" -UseBasicParsing
          $p = Start-Process -FilePath "$env:RUNNER_TEMP\cuda1143.exe" `
               -ArgumentList '-s','nvcc_11.4','cudart_11.4','cublas_11.4','cublas_dev_11.4','visual_studio_integration_11.4' `
               -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "CUDA 11.4.3 install failed, exit=$($p.ExitCode)" }
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.4\bin"
          "$cudaBin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          "CUDA_PATH=C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.4" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          & "$cudaBin\nvcc.exe" -V

          # 关键修复：网络安装器常把 CUDA 的 VS 集成文件漏装/装错路径，
          # 导致 CMake Visual Studio generator 在 enable_language(CUDA) 报
          # "No CUDA toolset found"。手动复制到 VS2019 的 BuildCustomizations。
          Write-Host "=== CUDA VS integration fix ==="
          $vsIntSrc = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.4\extras\visual_studio_integration\MSBuildExtensions"
          $vsIntDst = "C:\Program Files (x86)\Microsoft Visual Studio\2019\BuildTools\MSBuild\Microsoft\VC\v160\BuildCustomizations"
          if (Test-Path $vsIntSrc) {
            New-Item -ItemType Directory -Force -Path $vsIntDst | Out-Null
            Copy-Item "$vsIntSrc\*.props","$vsIntSrc\*.targets","$vsIntSrc\*.xml" $vsIntDst -Force -ErrorAction SilentlyContinue
            Write-Host "Copied CUDA VS integration files into VS2019 BuildCustomizations:"
            Get-ChildItem $vsIntDst -Filter "CUDA*" | Select-Object -ExpandProperty Name
          } else {
            Write-Warning "VS integration source not found: $vsIntSrc"
          }
          Write-Host "CMake: $((cmake --version | Select-Object -First 1))"

      # ---------- 3. 拉 llama.cpp v1.0.0 并打 Win7 补丁 ----------
      - name: Clone llama.cpp v1.0.0
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.0.0 https://github.com/ggml-org/llama.cpp.git llama.cpp-1.0.0
          if ($LASTEXITCODE -ne 0) { throw "git clone llama.cpp v1.0.0 failed" }

      - name: Apply Win7 compat patch (v1.0.0, with self-check)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git -C llama.cpp-1.0.0 apply --check ..\win7-compat-v100.patch
          if ($LASTEXITCODE -ne 0) {
            throw "PATCH CHECK FAILED: win7-compat-v100.patch does not apply to v1.0.0. See README."
          }
          git -C llama.cpp-1.0.0 apply ..\win7-compat-v100.patch
          # 校验三个 API 替换标记都注入
          # -SimpleMatch 必须加：#if 0 && defined(_WIN32_WINNT) 含括号，
          # 正则模式下 () 被当捕获组，永远匹配不到字面文本，会误报补丁失败。
          $c = Select-String -Path "llama.cpp-1.0.0\vendor\cpp-httplib\httplib.cpp" -Pattern "Win7 compat" -SimpleMatch -Quiet
          $h = Select-String -Path "llama.cpp-1.0.0\vendor\cpp-httplib\httplib.h" -Pattern "#if 0 && defined(_WIN32_WINNT)" -SimpleMatch -Quiet
          if (-not ($c -and $h)) {
            Write-Host "DIAG cpp-marker=$c h-marker=$h"
            Write-Host "DIAG httplib.h _WIN32_WINNT lines:"
            Select-String -Path "llama.cpp-1.0.0\vendor\cpp-httplib\httplib.h" -Pattern "_WIN32_WINNT" -SimpleMatch | Select-Object -First 6
            throw "Win7 patch markers not found after apply."
          }
          Write-Host "Win7 v1.0.0 patch applied and verified."
          Write-Host "NOTE: ggml-cpu.c needs no patch in v1.0.0 - SetThreadInformation is already guarded by #if _WIN32_WINNT >= 0x0602."

      # ---------- 4. CMake 配置 + 编译 ----------
      # v1.0.0 选项：GGML_NATIVE/GGML_OPENMP_ENABLED/BUILD_SHARED_LIBS 均有效；
      # LLAMA_CURL 已废弃（不传）；额外关 LLAMA_OPENSSL 减 Win8+ 导入风险。
      - name: Configure & build (CPU)
        if: matrix.variant == 'cpu'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cmake -S llama.cpp-1.0.0 -B build-cpu -C win7-cache.cmake -G "Visual Studio 16 2019" -A x64 `
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP_ENABLED=OFF `
            -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_UI=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw "cmake configure (cpu) failed" }
          cmake --build build-cpu --config Release --parallel 8 --target llama-server llama-cli
          if ($LASTEXITCODE -ne 0) { throw "cmake build (cpu) failed" }

      - name: Configure & build (CUDA, sm_61 for P2200, Ninja)
        if: matrix.variant == 'cuda'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.4\bin"
          $env:PATH = "$cudaBin;$env:PATH"
          # 用 Ninja 绕开 VS 的 CUDA MSBuild 集成（"No CUDA toolset found" 根因）。
          # 需 cl.exe 在 PATH（msvc-dev-cmd 已设）+ nvcc 在 PATH（上一步 GITHUB_PATH）。
          cmake -S llama.cpp-1.0.0 -B build-cuda -C win7-cache.cmake -G Ninja `
            -DCMAKE_C_COMPILER=cl.exe -DCMAKE_CXX_COMPILER=cl.exe `
            -DGGML_CUDA=ON -DCMAKE_CUDA_ARCHITECTURES=61 `
            -DCMAKE_CUDA_COMPILER="$cudaBin\nvcc.exe" `
            -DCUDAToolkit_ROOT="C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.4" `
            -DBUILD_SHARED_LIBS=OFF -DGGML_NATIVE=OFF -DGGML_OPENMP_ENABLED=OFF `
            -DLLAMA_OPENSSL=OFF -DLLAMA_CURL=OFF `
            -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_EXAMPLES=OFF `
            -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON `
            -DLLAMA_USE_PREBUILT_UI=OFF -DLLAMA_BUILD_UI=OFF `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          if ($LASTEXITCODE -ne 0) { throw "cmake configure (cuda) failed" }
          # GitHub 免费 windows runner 仅 7GB RAM；fattn 的 FP8/量化模板单实例
          # 可超 1GB，--parallel 8 会 OOM 导致 "subcommand failed" 且无明确 error。
          # 降到 2 并行（约等于 runner 核数），牺牲编译时间换稳定。
          Write-Host "=== Free RAM (MB) before CUDA build ==="
          (Get-CimInstance Win32_OperatingSystem).FreePhysicalMemory
          cmake --build build-cuda --parallel 2 --target llama-server llama-cli
          if ($LASTEXITCODE -ne 0) { throw "cmake build (cuda) failed" }

      # ---------- 5. 发版门禁 ----------
      - name: Win7 compatibility gate (import-audit.ps1)
        shell: pwsh
        id: audit
        continue-on-error: true
        run: |
          # cuda=Ninja 单配置 -> bin\；cpu=VS 多配置 -> bin\Release\
          $exe = if ('${{ matrix.variant }}' -eq 'cuda') { 'build-cuda\bin\llama-server.exe' } else { 'build-cpu\bin\Release\llama-server.exe' }
          if (-not (Test-Path $exe)) { throw "exe not found for audit: $exe" }
          . .\import-audit.ps1 -Path $exe

      # ---------- 6. 打包 ----------
      - name: Stage deployables
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $src = if ('${{ matrix.variant }}' -eq 'cuda') { 'build-cuda\bin' } else { 'build-cpu\bin\Release' }
          if (-not (Test-Path "$src\llama-server.exe")) { throw "llama-server.exe not found at $src" }
          New-Item -ItemType Directory -Force -Path deploy | Out-Null
          Copy-Item "$src\llama-server.exe" deploy\
          Copy-Item "$src\llama-cli.exe" deploy\
          if ('${{ matrix.variant }}' -eq 'cuda') {
            $cudaBin = "C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v11.4\bin"
            foreach ($dll in @('cudart64_110.dll','cublas64_11.dll','cublasLt64_11.dll')) {
              if (Test-Path "$cudaBin\$dll") { Copy-Item "$cudaBin\$dll" deploy\ }
              else { Write-Warning "Missing CUDA DLL: $dll" }
            }
          }
          $audit = if ('${{ steps.audit.outcome }}' -eq 'success') { 'PASS' } else { 'AUDIT_FAIL' }
          "audit=$audit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Get-ChildItem deploy | Format-Table Name,Length

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: llama-v100-win7-${{ matrix.variant }}-${{ env.audit }}
          path: deploy\*
          if-no-files-found: error
          retention-days: 90
